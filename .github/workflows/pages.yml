# main에 푸시하면 세 앱을 빌드해 GitHub Pages로 배포한다.
# Vercel 배포와 별개로 동작하며, 서로 영향을 주지 않는다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 끊지 않고 기다린다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 타입 검사
        run: npm run lint

      - name: 빌드
        # Pages는 https://<사용자>.github.io/<저장소>/ 아래에 올라가므로
        # 자산 경로의 기준을 저장소 이름으로 맞춘다.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # enablement: true 면 저장소에 Pages가 아직 꺼져 있어도 이 단계가 켜 준다.
      # (없으면 "Get Pages site failed ... Not Found"로 멈추고 Settings에서 손으로 켜야 한다.)
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
