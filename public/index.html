<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빨간 벽 허물기 수업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 방향: 교실 칠판 앞에 선 빨간 벽돌담과 하늘색. 한 화면에 한 장면씩 넘기는 수업용 앱. 단일 테마. */
:root{
  --sky:#b9e6fb; --sky-soft:#e6f6fe; --brick:#b23a26; --brick-deep:#7f2517; --brick-hi:#c9472f;
  --cream:#fff6dc; --ink:#2a1d1a; --leaf:#2f7d46; --blue:#2a86d4; --rose:#f9d9cf; --paper:#ffffff;
  --display:"Black Han Sans","Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --hand:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky-soft);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

/* 상단 진행 */
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--paper);border-bottom:3px solid var(--brick);flex-wrap:wrap}
.brand{font-family:var(--display);font-size:20px;color:var(--brick);white-space:nowrap;margin-right:4px}
.phases{display:flex;gap:6px;flex:1;min-width:0;flex-wrap:wrap}
.phase{display:flex;align-items:center;gap:6px;border:2px solid transparent;background:transparent;border-radius:999px;padding:3px 12px 3px 6px;font-size:15px;color:#7a6a64}
.phase svg{width:26px;height:18px;flex:none}
.phase .bd{fill:#b8b2ae}
.phase.reached .bd{fill:var(--blue)}
.phase.now{background:var(--sky);border-color:var(--blue);color:var(--ink);font-weight:700}
.tools{display:flex;gap:6px}
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:6px 14px;font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.red{background:var(--brick);color:#fff;border-color:var(--brick-deep);box-shadow:0 3px 0 var(--brick-deep)}
.btn.red:active{box-shadow:none}
.btn.small{font-size:14px;padding:4px 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* 무대 */
.stage{flex:1;min-height:0;overflow:auto;position:relative}
.slide{min-height:100%;padding:22px 20px 28px;display:flex;flex-direction:column;align-items:center;gap:18px}
.slide.sky{background:linear-gradient(var(--sky) 0,var(--sky-soft) 100%)}
.slide.rose{background:var(--rose)}
.slide.paper{background:var(--paper)}
.slide.brick{background:var(--brick);color:#fff}
.wrap{width:100%;max-width:1060px;display:flex;flex-direction:column;gap:16px}
.center{align-items:center;text-align:center}
.kicker{font-family:var(--hand);font-size:20px;color:var(--brick)}
.brick .kicker{color:#ffd9a8}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:clamp(34px,6vw,68px)}
h2{font-size:clamp(26px,4.2vw,46px)}
.r{color:var(--brick-hi)}
.brick .r{color:#ffe08a}
.lead{font-size:clamp(18px,2.2vw,24px);max-width:46em;margin:0}
.hand{font-family:var(--hand)}
.note{font-size:15px;color:#6b5a54}
.brick .note{color:#ffd9cf}

/* 벽돌 */
.wall{display:flex;flex-wrap:wrap;gap:6px;padding:12px;background:var(--brick-deep);border-radius:6px;width:100%}
.b{position:relative;flex:1 1 150px;min-height:70px;background:var(--brick);color:#fff;border:0;border-radius:4px;padding:8px 12px;text-align:left;font-size:16px;line-height:1.35;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.12);display:flex;flex-direction:column;justify-content:center;gap:2px}
.b.alt{background:var(--brick-hi)}
.b.ghost{background:transparent;border:2px dashed rgba(255,255,255,.35);box-shadow:none;color:rgba(255,255,255,.7);justify-content:center;align-items:center;text-align:center;font-size:14px}
.b.pick{cursor:pointer}
.b.pick:hover{filter:brightness(1.12)}
.b.sel{outline:4px solid #ffe08a;outline-offset:-2px}
.b.fixed{background:var(--cream);color:var(--ink);box-shadow:inset 0 -5px 0 #d8c99c;border:2px solid var(--leaf)}
.b.fixed .was{font-size:13px;color:#8a4a3e;text-decoration:line-through;text-decoration-thickness:1px}
.b.fixed .fx{font-weight:700;color:var(--leaf)}
.b.fixed svg{position:absolute;right:6px;top:4px;width:22px;height:22px}
.wallcap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.count{font-family:var(--hand);font-size:20px}

/* 카드·입력 */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:18px 20px;box-shadow:0 5px 0 rgba(0,0,0,.18);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{flex:1 1 260px;display:flex;flex-direction:column;gap:4px}
label{font-weight:700;font-size:16px}
input[type=text],textarea{border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:#fffdf6;width:100%}
textarea{resize:vertical;min-height:68px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px dashed var(--ink);background:var(--cream);border-radius:999px;padding:4px 14px;font-size:15px}
.chip:hover{background:#fff0b8}
.reveal{background:var(--sky);border:3px solid var(--blue);border-radius:14px;padding:14px 18px;font-family:var(--hand);font-size:clamp(22px,3vw,32px);animation:pop .35s ease-out both}
.tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tag{background:var(--brick);color:#fff;border-radius:8px;padding:6px 16px;font-family:var(--display);font-size:clamp(20px,3vw,32px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.tag.gold{background:#ffe08a;color:var(--brick-deep)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}

/* 장면 */
.scene{position:relative;width:100%;max-width:860px;border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff}
.scene svg{display:block;width:100%;height:auto}
.bubble{position:absolute;left:3%;top:4%;max-width:56%;background:#fff;border:3px solid var(--ink);border-radius:50% / 40%;padding:clamp(10px,2.4vw,26px) clamp(16px,3vw,34px);font-family:var(--hand);font-size:clamp(14px,2.4vw,26px);line-height:1.4;text-align:center}
.bubble::after{content:"";position:absolute;right:12%;bottom:-18px;width:18px;height:18px;border:3px solid var(--ink);border-radius:50%;background:#fff}
.seg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seg .btn[aria-pressed=true]{background:var(--ink);color:#fff}

/* 시간표 벽 */
.tt{display:flex;flex-direction:column;gap:6px;background:var(--brick-deep);padding:12px;border-radius:6px;width:100%}
.tr{display:flex;gap:6px}
.tr>*{flex:1 1 0;min-width:0}
.tr .fill{flex:.55;background:var(--brick);border-radius:4px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.tr .fill.half{flex:.3}
.tb{min-height:84px;border:0;border-radius:4px;background:var(--brick-hi);color:#fff;font-family:var(--display);font-size:clamp(17px,2.6vw,28px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;overflow:hidden}
.tb:hover{filter:brightness(1.12)}
.tb.done{background:#fff;color:var(--ink);box-shadow:inset 0 -5px 0 #d6d0c4}
.tb img{width:100%;max-height:70px;object-fit:contain}
.tb small{font-family:var(--body);font-size:13px;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;width:100%}
.step{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.step b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brick);color:#fff;display:grid;place-items:center;font-family:var(--hand)}
.meter{height:12px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden;width:100%}
.meter i{display:block;height:100%;background:#ffe08a;transition:width .3s}

/* 다짐 */
.fall{position:relative;width:100%;max-width:860px;height:260px;border-radius:14px;overflow:hidden;background:linear-gradient(var(--sky),var(--sky-soft));border:4px solid var(--ink)}
.fall .bricks{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(4,1fr);gap:4px;padding:4px;background:var(--brick-deep)}
.fall .bricks i{background:var(--brick);border-radius:3px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);transition:transform 1.1s cubic-bezier(.5,0,.9,.6),opacity 1.1s}
.fall .bricks i:nth-child(3n){background:var(--brick-hi)}
.fall.down .bricks{background:transparent}
.fall.down .bricks i{transform:translateY(340px) rotate(var(--rot));opacity:0;transition-delay:var(--d)}
.fall .msg{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;font-family:var(--display);font-size:clamp(20px,3.6vw,38px);line-height:1.35;text-shadow:0 2px 0 #fff;pointer-events:none}
.fall .crowd{position:absolute;left:0;right:0;bottom:0;height:80px;display:flex;justify-content:center;align-items:flex-end;gap:2px}
.names{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.name{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 14px;font-family:var(--hand);font-size:18px}

/* 모달·서랍 */
.scrim{position:fixed;inset:0;background:rgba(30,15,10,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.scrim.on{display:flex}
.modal{background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:16px;width:100%;max-width:680px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;color:var(--ink)}
.modal h3{margin:0;font-family:var(--display);font-weight:400;font-size:26px}
.pal{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink)}
.sw[aria-pressed=true]{box-shadow:0 0 0 4px var(--blue)}
.dot{width:38px;height:38px;border-radius:10px;border:2px solid var(--ink);background:#fff;display:grid;place-items:center}
.dot[aria-pressed=true]{background:var(--sky);border-color:var(--blue)}
.dot i{display:block;background:var(--ink);border-radius:50%}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--paper);border-left:4px solid var(--ink);z-index:25;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;color:var(--ink)}
.drawer.on{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:3px solid var(--ink);background:var(--cream)}
.drawer header b{font-family:var(--display);font-size:22px;font-weight:400}
.drawer .bd{padding:14px 16px 28px;overflow:auto;display:flex;flex-direction:column;gap:14px;font-size:16px}
.drawer h4{margin:0 0 4px;font-size:15px;color:var(--brick)}
.drawer dl{margin:0;display:grid;gap:8px}
.drawer dt{font-weight:700}
.drawer dd{margin:0}
.flow{display:grid;gap:8px}
.flow div{border-left:5px solid var(--brick);padding:4px 10px;background:#fbf6ea}
.flow div.cur{border-color:var(--blue);background:var(--sky-soft)}
.flow b{display:block}
.tip{background:var(--sky-soft);border:2px solid var(--blue);border-radius:10px;padding:10px 12px}

/* 하단 */
.bot{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--paper);border-top:3px solid var(--brick)}
.dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots button{width:14px;height:14px;border-radius:50%;border:2px solid var(--brick);background:#fff;padding:0}
.dots button.on{background:var(--brick)}
.dots button.seen{background:#e7b1a6}
.pg{font-family:var(--hand);font-size:18px;min-width:56px;text-align:center}

/* 아이콘 선택 · 공유 */
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.tb .ic{font-size:clamp(28px,4.4vw,46px);display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.tabs{display:flex;gap:6px}
.tabs .btn[aria-pressed=true]{background:var(--ink);color:#fff}
.tray{min-height:68px;border:3px dashed var(--ink);border-radius:12px;background:#fffdf6;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px}
.tray .ph{color:#8a7a74;font-size:15px}
.ib{width:54px;height:54px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-size:30px;display:grid;place-items:center;padding:0}
.ib:hover{background:var(--sky-soft)}
.ib.on{background:#fff0b8;border-color:var(--brick)}
.ib.big{width:64px;height:64px;font-size:38px}
.igrid{display:flex;flex-wrap:wrap;gap:6px}
.glabel{font-size:14px;font-weight:700;color:var(--brick);margin:2px 0 -2px}
.pane[hidden]{display:none}
.share{display:flex;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;background:var(--paper)}
.pill i{width:10px;height:10px;border-radius:50%;background:#b8b2ae;display:block}
.pill.live i{background:var(--leaf)}
.pill.warn i{background:#f29900}
.msgbox{background:var(--sky-soft);border:2px solid var(--blue);border-radius:10px;padding:10px 12px;font-size:15px}
.msgbox.bad{background:#fff0e6;border-color:#e0782f}
.gal{display:grid;gap:12px}
.gal .stu{border:2px solid var(--ink);border-radius:12px;padding:8px 10px;background:#fffdf6}
.gal .stu b{font-family:var(--hand);font-size:20px}
.mini{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}
.mini div{aspect-ratio:3/2;border-radius:4px;background:var(--brick-hi);display:grid;place-items:center;overflow:hidden;font-size:18px;color:#fff;font-size:12px}
.mini div.on{background:#fff;color:var(--ink);border:1px solid #d6d0c4}
.mini img{width:100%;height:100%;object-fit:cover}
.mini .e{font-size:18px}
@media (max-width:640px){
  body{font-size:16px}
  .phase:not(.now) span{display:none}
  .phase{padding:3px 6px}
  .brand{font-size:17px}
  .slide{padding:16px 12px 22px}
  .bubble{max-width:66%}
  .tr .fill{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">빨간 벽 허물기</div>
    <nav class="phases" id="phases" aria-label="수업 단계"></nav>
    <div class="tools">
      <button class="pill" data-act="share" id="sharePill" aria-label="공유 저장 설정"><i></i><span id="shareTxt">이 기기에만 저장</span></button>
      <button class="btn small" data-act="fs" id="fsbtn">전체 화면</button>
      <button class="btn small" data-act="teacher">교사용</button>
    </div>
  </div>
  <main class="stage" id="stage" aria-live="polite"></main>
  <div class="bot">
    <button class="btn" data-act="prev" id="prev">이전</button>
    <div class="dots" id="dots"></div>
    <div class="pg" id="pg"></div>
    <button class="btn red" data-act="next" id="next">다음</button>
  </div>
</div>

<div class="scrim" id="drawScrim" role="dialog" aria-modal="true" aria-labelledby="drawTitle">
  <div class="modal">
    <h3 id="drawTitle">그림으로 바꾸기</h3>
    <div class="note">글을 몰라도 이해할 수 있게 어울리는 이모티콘으로 표현해 보세요.</div>
    <div id="paneIcon">
      <div class="note" style="margin-bottom:6px">이모티콘을 눌러 벽돌에 담아요. 최대 3개까지 고를 수 있어요. 담은 이모티콘을 누르면 빠져요.</div>
      <div class="tray" id="tray" aria-live="polite"></div>
      <div class="glabel" style="margin-top:10px" id="sugLabel">이 칸에 어울리는 이모티콘</div>
      <div class="igrid" id="sugGrid"></div>
      <div style="margin-top:10px"><button class="btn small" data-act="moreIco" id="moreBtn">다른 이모티콘 더 보기</button></div>
      <div id="allGrid" style="display:none;gap:6px;margin-top:8px"></div>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn small" data-act="cellClear" id="clearCell" hidden>이 칸 비우기</button>
      <button class="btn" data-act="drawCancel">닫기</button>
      <button class="btn red" data-act="drawSave" id="saveBrick">이 벽돌에 붙이기</button>
    </div>
  </div>
</div>

<div class="scrim" id="shareScrim" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
  <div class="modal">
    <h3 id="shareTitle">우리 반 공유 저장</h3>
    <div class="note">같은 반 코드를 쓰면 여러 기기에서 같은 벽과 작품을 함께 볼 수 있어요.</div>
    <div class="field"><label for="codeIn">반 코드</label><input type="text" id="codeIn" maxlength="20" autocomplete="off" placeholder="예) 5-1 또는 5학년1반"></div>
    <div class="field"><label for="nameIn">내 이름</label><input type="text" id="nameIn" maxlength="12" autocomplete="off" placeholder="작품 모아보기에 표시돼요"></div>
    <div class="msgbox" id="shareMsg"></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn small" data-act="unshare" id="unshareBtn">공유 끄기</button>
      <button class="btn" data-act="shareClose">닫기</button>
      <button class="btn red" data-act="shareGo">연결하기</button>
    </div>
  </div>
</div>

<div class="scrim" id="galScrim" role="dialog" aria-modal="true" aria-labelledby="galTitle">
  <div class="modal">
    <h3 id="galTitle">우리 반 친구들의 작품</h3>
    <div class="gal" id="galBody"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-act="galClose">닫기</button></div>
  </div>
</div>

<aside class="drawer" id="drawer" aria-label="교사용 안내" aria-hidden="true">
  <header><b>교사용 안내</b><button class="btn small" data-act="teacherClose">닫기</button></header>
  <div class="bd" id="drawerBody"></div>
</aside>

<script>
/* 독립 실행용 공유 저장 어댑터: claude.ai의 db 기능과 같은 모양으로 이 서버의 /api를 부릅니다. */
(function(){
  if(window.claude&&window.claude.use)return;
  window.__standalone=true;
  var uid="";try{uid=localStorage.getItem("rw-uid")||"";if(!uid){uid="u_"+Math.random().toString(36).slice(2,12);localStorage.setItem("rw-uid",uid)}}catch(e){uid="u_"+Math.random().toString(36).slice(2,12)}
  function api(p,body){
    var opt=body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{};
    return fetch(p,opt).then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok)throw {code:j.code||"unavailable",message:j.error||""};return j})},function(){throw {code:"unavailable",message:"network"}});
  }
  var cfg={poll:1500,storage:true};
  var cfgP=api("/api/config").then(function(j){cfg=j||cfg;window.__cfg=cfg}).catch(function(){});
  var subs=[],timer=null,busy=false,again=false;
  function tick(){
    if(!subs.length)return;
    if(busy){again=true;return}
    busy=true;again=false;
    var paths=[];subs.forEach(function(s){if(paths.indexOf(s.path)<0)paths.push(s.path)});
    api("/api/lists?paths="+encodeURIComponent(paths.join(","))).then(function(j){
      busy=false;var L=(j&&j.lists)||{};subs.slice().forEach(function(s){if(L[s.path])s.deliver(L[s.path])});
      if(again)tick();
    },function(){busy=false});
  }
  function startTimer(){if(timer)return;cfgP.then(function(){if(!timer&&subs.length)timer=setInterval(tick,cfg.poll||1500)})}
  function docRef(p){
    return {path:p,id:p.split("/").pop(),
      get:function(){return api("/api/doc?path="+encodeURIComponent(p)).then(function(j){return {id:p.split("/").pop(),exists:j.exists,data:function(){return j.data||undefined},metadata:{fromCache:false}}})},
      set:function(d){return api("/api/set",{path:p,data:d}).then(tick)},
      update:function(d){return api("/api/update",{path:p,data:d}).then(tick)},
      delete:function(){var pin="";try{pin=localStorage.getItem("rw-pin")||""}catch(e){}return api("/api/delete",{path:p,pin:pin}).then(tick)}};
  }
  function colRef(p,ord,dir){
    function snapOf(list){
      var docs=list.map(function(d){return {id:d.id,exists:true,data:function(){return d.data},metadata:{fromCache:false}}});
      if(ord){var m=dir==="desc"?-1:1;docs.sort(function(a,b){var x=a.data()[ord],y=b.data()[ord];x=x==null?Infinity:x;y=y==null?Infinity:y;return x<y?-m:x>y?m:0})}
      return {docs:docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false},docChanges:function(){return []}};
    }
    return {path:p,
      orderBy:function(f,d){return colRef(p,f,d)},
      doc:function(id){return docRef(p+"/"+id)},
      get:function(){return api("/api/lists?paths="+encodeURIComponent(p)).then(function(j){return snapOf((j.lists||{})[p]||[])})},
      onSnapshot:function(next,err){
        var s={path:p,last:null,deliver:function(docs){var sig=JSON.stringify(docs);if(sig!==s.last){s.last=sig;next(snapOf(docs))}}};
        subs.push(s);startTimer();tick();
        return function(){var i=subs.indexOf(s);if(i>=0)subs.splice(i,1);if(!subs.length&&timer){clearInterval(timer);timer=null}};
      }};
  }
  var db={doc:docRef,collection:function(p){return colRef(p)}};
  var user={id:function(){return Promise.resolve(uid)},can:function(){return Promise.resolve(true)},canEdit:function(){return Promise.resolve(true)},isOwner:function(){return Promise.resolve(false)}};
  window.claude={use:function(n){return Promise.resolve(n==="db"?db:n==="user"?user:null)}};
})();

/* ---------- 렌더 ---------- */
var stage=document.getElementById("stage");
function render(keepScroll){
  var sc=stage.scrollTop;
  var s=SLIDES[cur.i];
  /* 입력 중인 글자와 커서를 다시 그린 뒤에도 유지 */
  var keep=null,ae=document.activeElement;
  var vals={};["findIn","fixIn","pledgeIn"].forEach(function(id){var e=document.getElementById(id);if(e)vals[id]=e.value});
  if(ae&&ae.id&&stage.contains(ae)&&ae.tagName==="INPUT"){keep={id:ae.id,a:ae.selectionStart,b:ae.selectionEnd}}
  stage.innerHTML='<section class="slide '+s.bg+'" aria-label="장면 '+(cur.i+1)+'">'+s.html()+'</section>';
  stage.scrollTop=keepScroll?sc:0;
  if(keepScroll){Object.keys(vals).forEach(function(id){var e=document.getElementById(id);if(e)e.value=vals[id]})}
  if(keep){var e2=document.getElementById(keep.id);if(e2){e2.focus();try{e2.setSelectionRange(keep.a,keep.b)}catch(x){}}}
  S.seen[cur.i]=1;
  chrome();
}
function chrome(){
  var ph="";PHASES.forEach(function(p){var now=cur.i>=p.from&&cur.i<=p.to,reached=cur.i>=p.from;ph+='<button class="phase'+(now?" now":"")+(reached?" reached":"")+'" data-act="goto" data-i="'+p.from+'"'+(now?' aria-current="step"':'')+'>'+BIRD+'<span>'+p.n+'</span></button>'});
  document.getElementById("phases").innerHTML=ph;
  var d="";for(var i=0;i<SLIDES.length;i++){d+='<button class="'+(i===cur.i?"on":(S.seen[i]?"seen":""))+'" data-act="goto" data-i="'+i+'" aria-label="'+(i+1)+'번 장면"></button>'}
  document.getElementById("dots").innerHTML=d;
  document.getElementById("pg").textContent=(cur.i+1)+" / "+SLIDES.length;
  document.getElementById("prev").disabled=cur.i===0;
  var nx=document.getElementById("next");nx.disabled=cur.i===SLIDES.length-1;
  if(location.hash!=="#s"+(cur.i+1)){try{history.replaceState(null,"","#s"+(cur.i+1))}catch(e){}}
  if(drawer.classList.contains("on"))teacherBody();
}
function go(i){if(i<0||i>=SLIDES.length)return;cur.i=i;render(false)}

  '<div><h4>수업 흐름</h4><div class="flow">'+FLOW.map(function(f){var now=cur.i>=f.s[0]&&cur.i<=f.s[1];return '<div class="'+(now?"cur":"")+'"><b>'+f.k+' · '+f.t+'</b>'+f.n+'<br><button class="btn small" style="margin-top:6px" data-act="goto" data-i="'+f.s[0]+'">이 단계로 이동</button></div>'}).join("")+'</div></div>'+
  '<div><h4>사용 방법</h4><ul style="margin:0;padding-left:20px"><li>왼쪽·오른쪽 방향키로 장면을 넘길 수 있어요.</li><li>공유를 켜지 않으면 벽돌과 그림은 이 기기의 브라우저에만 저장돼요.</li><li>학생이 돌아가며 입력하거나, 교사가 말을 받아 입력해도 됩니다.</li></ul></div>'+
  '<div><h4>공유 저장 쓰는 방법</h4><ol style="margin:0;padding-left:20px">'+(STAND?'<li>수업 서버를 켠 컴퓨터의 주소(예: http://192.168.0.12:3000)를 학생 기기에서 열어요. 로그인은 필요 없어요.</li><li>모든 기기에서 위쪽 ‘공유’ 버튼을 눌러 같은 반 코드를 입력해요. 반마다 코드를 다르게 쓰면 반별로 따로 저장돼요.</li>':'<li>claude.ai에서 이 페이지의 공유 설정을 열어 학생(또는 학교 구성원)에게 ‘Contributor’ 권한으로 공유해요.</li><li>모든 기기에서 위쪽 ‘공유’ 버튼을 눌러 같은 반 코드를 입력해요. 반마다 코드를 다르게 쓰면 반별로 따로 저장돼요.</li><li>학생은 claude.ai에 로그인한 상태여야 쓸 수 있어요. 보기만 가능한 권한이면 읽기만 돼요.</li>')+'</ol><p class="note" style="margin:6px 0 0">현재 상태: <b>'+esc(document.getElementById("shareTxt").textContent)+'</b></p><button class="btn small" style="margin-top:6px" data-act="share">공유 설정 열기</button></div>'+
  '<div>'+(STAND?'<h4>교사 PIN</h4><p class="note" style="margin:0 0 6px">서버에 PIN을 설정했다면 입력해 두세요. 활동 결과 지우기에 필요해요.</p><input type="password" id="pinIn" autocomplete="off" placeholder="교사 PIN" value="'+esc((function(){try{return localStorage.getItem("rw-pin")||""}catch(e){return ""}})())+'" style="margin-bottom:12px">':'')+'<h4>활동 결과 지우기</h4><p class="note" style="margin:0 0 6px">쌓은 벽돌, 그림, 다짐 이름이 모두 지워져요. 공유 중이면 우리 반 공유 데이터가 지워지고, 아니면 이 기기의 데이터가 지워져요.</p><button class="btn small" data-act="reset">'+(resetArmed?'한 번 더 누르면 모두 지워요':'활동 결과 지우기')+'</button></div>';
  document.getElementById("drawerBody").innerHTML=h;
}
function openT(){drawer.classList.add("on");drawer.setAttribute("aria-hidden","false");resetArmed=false;teacherBody()}
function closeT(){drawer.classList.remove("on");drawer.setAttribute("aria-hidden","true")}

/* ---------- 아이콘 ---------- */
var scrim=document.getElementById("drawScrim");
var DM={sub:null,icons:[],more:false};
function ibtn(e,extra){var on=DM.icons.indexOf(e)>=0;return '<button class="ib emo'+(on?' on':'')+(extra||'')+'" data-act="ico" data-e="'+e+'" aria-pressed="'+on+'" aria-label="아이콘 '+e+'">'+e+'</button>'}
function buildIcons(){
  var tray=document.getElementById("tray");
  tray.innerHTML=DM.icons.length?DM.icons.map(function(e,i){return '<button class="ib big emo on" data-act="icoDel" data-i="'+i+'" aria-label="'+e+' 빼기">'+e+'</button>'}).join(""):'<span class="ph">아래에서 이모티콘을 골라 보세요</span>';
  document.getElementById("sugGrid").innerHTML=(SUG[DM.sub]||[]).map(function(e){return ibtn(e," big")}).join("");
  document.getElementById("allGrid").innerHTML=ICONS.map(function(g){return '<div><div class="glabel">'+g[0]+'</div><div class="igrid">'+g[1].map(function(e){return ibtn(e,"")}).join("")+'</div></div>'}).join("");
  document.getElementById("allGrid").style.display=DM.more?"grid":"none";
  document.getElementById("moreBtn").textContent=DM.more?"다른 이모티콘 접기":"다른 이모티콘 더 보기";
  document.getElementById("sugLabel").textContent="‘"+DM.sub+"’에 어울리는 이모티콘";
  document.getElementById("saveBrick").disabled=!DM.icons.length;
}
function openDraw(s){
  DM.sub=s;DM.icons=[];DM.more=false;
  var d=normCell(S.draws[s]);
  if(d)DM.icons=d.v.slice();
  document.getElementById("drawTitle").textContent="‘"+s+"’에 어울리는 이모티콘을 골라 보세요";
  document.getElementById("clearCell").hidden=!d;
  buildIcons();
  scrim.classList.add("on");
}
function closeDraw(){scrim.classList.remove("on");DM.sub=null}
function saveDraw(){
  if(!DM.icons.length)return;
  var s=DM.sub;closeDraw();setCell(s,{k:"icon",v:DM.icons.slice(0,3)});
}
function pickIcon(e){var i=DM.icons.indexOf(e);if(i>=0)DM.icons.splice(i,1);else if(DM.icons.length<3)DM.icons.push(e);buildIcons()}

/* ---------- 공유 저장 (db) ---------- */
function normCode(s){
  s=String(s||"").trim().toLowerCase();var out="";
  for(var ch of s){ if(/[a-z0-9]/.test(ch))out+=ch; else if(/[\s\-_.]/.test(ch))out+="-"; else out+="u"+ch.codePointAt(0).toString(16)+"-"; }
  out=out.replace(/-+/g,"-").replace(/^-|-$/g,"");return out.slice(0,60);
}
function P(sub){return "classes/"+SH.code+"/"+sub}
function myId(){return SH.uid||PREF.lid}
function setStatus(st,msg){SH.status=st;SH.msg=msg||"";shareChrome()}
function shareChrome(){
  var pill=document.getElementById("sharePill"),tx=document.getElementById("shareTxt");
  var map={off:"이 기기에만 저장",connecting:"연결 중…",live:"공유 중 · "+(PREF.code||""),readonly:"보기만 가능 · "+(PREF.code||""),nodb:"공유할 수 없음",slow:"연결이 늦어요 · "+(PREF.code||""),err:"공유 오류"};
  tx.textContent=map[SH.status]||map.off;
  pill.className="pill"+(SH.status==="live"?" live":(SH.status==="off"?"":(SH.status==="nodb"||SH.status==="err"?" warn":" warn")));
  var box=document.getElementById("shareMsg");if(box){
    var t={
      off:"공유가 꺼져 있어요. 지금은 이 기기의 브라우저에만 저장돼요. 반 코드를 입력하고 연결하면, 같은 코드를 입력한 모든 기기가 같은 벽과 작품을 함께 봐요.",
      connecting:"연결하는 중이에요.",
      live:"공유 중이에요. 이 기기에서 쌓은 벽돌, 고른 아이콘, 다짐이 같은 반 코드를 쓰는 기기에 바로 나타나요.",
      readonly:STAND?"이 기기에서는 쓰기가 막혀 있어요. 선생님께 알려 주세요.":"이 계정으로는 보기만 할 수 있어요. 선생님이 공유 설정에서 이 페이지를 ‘Contributor’ 권한으로 열어 주어야 쓸 수 있어요.",
      nodb:STAND?(SH.msg==="storage"?"서버의 공유 저장소가 아직 설정되지 않았어요. 선생님이 배포 설정(Redis 저장소 연결)을 마쳐야 해요. 지금은 이 기기에만 저장돼요.":"수업 서버에 연결할 수 없어요. 주소가 맞는지, 인터넷이 연결되어 있는지 확인해 주세요. 지금은 이 기기에만 저장돼요."):"이 화면에서는 공유 저장을 쓸 수 없어요. claude.ai에 로그인한 상태로 선생님이 공유한 링크를 열어야 해요. 지금은 이 기기에만 저장돼요.",
      slow:"서버 응답이 늦어요. 조금 기다려도 안 되면 인터넷 연결을 확인해 주세요.",
      err:"공유 저장에 문제가 생겼어요."+(SH.msg?" ("+SH.msg+")":"")
    };
    box.textContent=t[SH.status]||t.off;box.className="msgbox"+((SH.status==="nodb"||SH.status==="err"||SH.status==="readonly")?" bad":"");
  }
  var ub=document.getElementById("unshareBtn");if(ub)ub.hidden=!SH.on;
}
function stopSubs(){SH.subs.forEach(function(u){try{u()}catch(e){}});SH.subs=[];if(SH.timer){clearTimeout(SH.timer);SH.timer=null}}
function goLocal(st){
  stopSubs();
  if(SH.on&&LOC){S.bricks=LOC.bricks;S.draws=LOC.draws;S.pledges=LOC.pledges}
  SH.on=false;SH.db=null;T={};setStatus(st||"off");render(true);
}
function dbFail(e){
  var c=e&&e.code;
  if(c==="invalid_argument"){SH.write=false;setStatus("readonly");return}
  if(c==="revoked"||c==="not_granted"){goLocal("nodb");return}
  if(c==="forbidden"){setStatus("err","교사 PIN이 맞지 않아요. 교사용 서랍에서 PIN을 확인해 주세요");return}
  if(c==="resource_exhausted"){setStatus("err","요청이 너무 많아요. 잠시 뒤에 다시 해 보세요");return}
  setStatus("err",c||"");
}
async function connect(code){
  var norm=normCode(code);if(!norm){setStatus("err","반 코드를 입력해 주세요");return}
  stopSubs();setStatus("connecting");
  var db=null,user=null;
  try{
    for(var w=0;w<30&&!(window.claude&&window.claude.use);w++){await new Promise(function(r){setTimeout(r,100)})}   /* 실행 환경이 준비될 때까지 최대 3초 기다림 */
    if(window.claude&&window.claude.use){db=await window.claude.use("db");try{user=await window.claude.use("user")}catch(e2){user=null}}
  }catch(e){db=null}
  if(!db){goLocal("nodb");return}
  if(STAND){try{var cf=await fetch("/api/config").then(function(r){return r.json()});if(cf&&cf.storage===false){goLocal("nodb");SH.msg="storage";setStatus("nodb","storage");return}}catch(e3){}}
  if(!SH.on){LOC={bricks:S.bricks,draws:S.draws,pledges:S.pledges}}
  SH.on=true;SH.db=db;SH.code=norm;SH.write=true;
  try{SH.uid=user?await user.id():null}catch(e){SH.uid=null}
  try{var cw=user?await user.can("data.write"):null;if(cw===false)SH.write=false;SH.admin=user?!!(await user.canEdit()):false}catch(e){}
  S.bricks=[];S.draws={};S.pledges=[];T={};
  var got=0;
  SH.timer=setTimeout(function(){if(SH.status==="connecting")setStatus("slow")},10000);
  function first(snap){if(!snap.metadata.fromCache){got++;if(SH.timer){clearTimeout(SH.timer);SH.timer=null}if(SH.status==="connecting"||SH.status==="slow")setStatus(SH.write?"live":"readonly");}}
  try{
    SH.subs.push(db.collection(P("bricks")).orderBy("at").onSnapshot(function(snap){
      S.bricks=snap.docs.map(function(d){var x=d.data()||{};return {id:d.id,t:String(x.t||""),f:x.f?String(x.f):null,at:x.at||0}});first(snap);refresh([9,10])},dbFail));
    SH.subs.push(db.collection(P("tables")).onSnapshot(function(snap){
      var mine={},others={};
      snap.docs.forEach(function(d){var x=d.data()||{};var cells={};Object.keys(x.cells||{}).forEach(function(k){var c=normCell(x.cells[k]);if(c)cells[k]=c});
        if(d.id===myId())mine=cells;else others[d.id]={name:String(x.name||""),cells:cells}});
      S.draws=mine;T=others;first(snap);refresh([11],true)},dbFail));
    SH.subs.push(db.collection(P("pledges")).orderBy("at").onSnapshot(function(snap){
      S.pledges=snap.docs.map(function(d){return String((d.data()||{}).name||"")}).filter(Boolean);first(snap);refresh([14])},dbFail));
  }catch(e){dbFail(e);return}
  render(true);
}
function refresh(slides,gal){
  if(slides.indexOf(cur.i)>=0)render(true);
  if(document.getElementById("galScrim").classList.contains("on"))buildGallery();
}
/* 쓰기 */
function wr(p){return p.catch(dbFail)}
function opAddBrick(t){
  var b={id:nid(),t:t,f:null,at:Date.now()};S.bricks.push(b);
  if(SH.on)wr(SH.db.doc(P("bricks/"+b.id)).set({t:t,f:null,at:b.at,by:myId()}));else save();
}
function opFix(id,t){
  S.bricks.forEach(function(b){if(b.id===id)b.f=t});
  if(SH.on)wr(SH.db.doc(P("bricks/"+id)).update({f:t}));else save();
}
var tBusy=false,tPend=false;
async function flushTable(){
  if(tBusy){tPend=true;return}tBusy=true;
  try{do{tPend=false;await SH.db.doc(P("tables/"+myId())).set({name:PREF.name||"",cells:S.draws,at:Date.now()})}while(tPend)}catch(e){dbFail(e)}
  tBusy=false;
}
function setCell(s,cell){
  if(cell)S.draws[s]=cell;else delete S.draws[s];
  if(SH.on)flushTable();else save();
  render(true);
}
function opPledge(n){
  if(SH.on){if(S.pledges.indexOf(n)<0)S.pledges.push(n);wr(SH.db.doc(P("pledges/"+myId())).set({name:n,at:Date.now()}))}
  else{if(S.pledges.indexOf(n)<0)S.pledges.push(n);save()}
}
async function resetAll(){
  if(!SH.on){S.bricks=[];S.draws={};S.pledges=[];save();return}
  try{
    for(var sub of ["bricks","tables","pledges"]){var snap=await SH.db.collection(P(sub)).get();for(var d of snap.docs){await SH.db.doc(P(sub+"/"+d.id)).delete()}}
    S.bricks=[];S.draws={};S.pledges=[];T={};
  }catch(e){dbFail(e)}
}
function buildGallery(){
  var list=[];
  var mine=S.draws;if(Object.keys(mine).length)list.push({name:(PREF.name||"나")+" (나)",cells:mine});
  Object.keys(T).forEach(function(id){if(Object.keys(T[id].cells).length)list.push({name:T[id].name||"이름 없는 친구",cells:T[id].cells})});
  var h=list.length?list.map(function(st){
    var n=SUBJ.filter(function(s){return st.cells[s]}).length;
    return '<div class="stu"><b>'+esc(st.name)+'</b> <span class="note">'+n+' / 12</span><div class="mini">'+SUBJ.map(function(s){var c=st.cells[s];
      return '<div class="'+(c?'on':'')+'" title="'+s+'">'+(c?'<span class="e emo">'+c.v.map(esc).join("")+'</span>':s)+'</div>'}).join("")+'</div></div>'}).join(""):'<div class="msgbox">아직 올라온 작품이 없어요. 친구들이 벽돌을 그림으로 바꾸면 여기에 모여요.</div>';
  document.getElementById("galBody").innerHTML=h;
}

/* ---------- 동작 ---------- */
function addFind(){
  var el=document.getElementById("findIn");var t=el.value.trim();if(!t){el.focus();return}
  el.value="";opAddBrick(t);render(true);var n=document.getElementById("findIn");if(n)n.focus();
}
function addFix(){
  var el=document.getElementById("fixIn");var t=el.value.trim();if(!t){el.focus();return}
  el.value="";var id=cur.sel;cur.sel=null;opFix(id,t);render(true);
}
function pledge(){
  var el=document.getElementById("pledgeIn");var n=el.value.trim();if(!n){el.focus();return}
  el.value="";opPledge(n);
  var was=cur.flags.down;cur.flags.down=true;render(true);
  if(!was){var f=document.getElementById("fall");if(f){f.classList.remove("down");void f.offsetWidth;requestAnimationFrame(function(){f.classList.add("down")})}}
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;var a=t.dataset.act;
  switch(a){
   case "next":go(cur.i+1);break;
   case "prev":go(cur.i-1);break;
   case "goto":go(+t.dataset.i);break;
   case "flag":cur.flags[t.dataset.k]=!cur.flags[t.dataset.k]||(t.dataset.k.charAt(0)!=="w"&&true);render(true);break;
   case "room":cur.flags.room=t.dataset.k;render(true);break;
   case "fixToggle":cur.flags.fix=t.dataset.v==="1";render(true);break;
   case "useEx":var i1=document.getElementById("findIn");i1.value=t.dataset.t;i1.focus();break;
   case "useFixEx":var i2=document.getElementById("fixIn");i2.value=t.dataset.t;i2.focus();break;
   case "addFind":addFind();break;
   case "addFix":addFix();break;
   case "pickBrick":var oldFix=document.getElementById("fixIn");if(oldFix)oldFix.value="";cur.sel=t.dataset.id;render(true);var f=document.getElementById("fixIn");if(f)f.focus();break;
   case "draw":openDraw(t.dataset.s);break;
   case "ico":pickIcon(t.dataset.e);break;
   case "moreIco":DM.more=!DM.more;buildIcons();break;
   case "icoDel":DM.icons.splice(+t.dataset.i,1);buildIcons();break;
   case "cellClear":var ss=DM.sub;closeDraw();setCell(ss,null);break;
   case "share":document.getElementById("codeIn").value=PREF.code;document.getElementById("nameIn").value=PREF.name;shareChrome();document.getElementById("shareScrim").classList.add("on");break;
   case "shareClose":document.getElementById("shareScrim").classList.remove("on");break;
   case "shareGo":
     PREF.code=document.getElementById("codeIn").value.trim();PREF.name=document.getElementById("nameIn").value.trim();savePref();
     connect(PREF.code).then(function(){if(SH.on){document.getElementById("shareScrim").classList.remove("on")}});break;
   case "unshare":goLocal("off");break;
   case "gallery":buildGallery();document.getElementById("galScrim").classList.add("on");break;
   case "galClose":document.getElementById("galScrim").classList.remove("on");break;
   case "drawCancel":closeDraw();break;
   case "drawSave":saveDraw();break;
   case "pledge":pledge();break;
   case "teacher":openT();break;
   case "teacherClose":closeT();break;
   case "reset":
     if(!resetArmed){resetArmed=true;teacherBody();break}
     cur.sel=null;cur.flags={};resetArmed=false;resetAll().then(function(){render(false);closeT()});break;
   case "fs":
     try{var d=document.documentElement;if(document.fullscreenElement){document.exitFullscreen()}else if(d.requestFullscreen){d.requestFullscreen().catch(function(){})}}catch(x){}
     break;
  }
});
document.addEventListener("input",function(e){if(e.target&&e.target.id==="pinIn"){try{localStorage.setItem("rw-pin",e.target.value)}catch(x){}}});
document.addEventListener("keydown",function(e){
  var tag=(e.target.tagName||"").toLowerCase();
  if(e.key==="Enter"&&!e.isComposing&&tag==="input"&&(e.target.id==="codeIn"||e.target.id==="nameIn")){var go2=document.querySelector("[data-act=shareGo]");if(go2)go2.click();return}
  if(e.key==="Enter"&&!e.isComposing&&tag==="input"){
    if(e.target.id==="findIn")addFind();else if(e.target.id==="fixIn")addFix();else if(e.target.id==="pledgeIn")pledge();return}
  if(e.key==="Escape"){var gs=document.getElementById("galScrim"),ss2=document.getElementById("shareScrim");if(gs.classList.contains("on"))gs.classList.remove("on");else if(ss2.classList.contains("on"))ss2.classList.remove("on");else if(scrim.classList.contains("on"))closeDraw();else closeT();return}
  if(tag==="input"||tag==="textarea"||document.querySelector(".scrim.on"))return;
  if(e.key==="ArrowRight")go(cur.i+1);
  if(e.key==="ArrowLeft")go(cur.i-1);
});
window.addEventListener("hashchange",function(){var m=/^#s(\d+)$/.exec(location.hash);if(m){var n=+m[1]-1;if(n!==cur.i&&n>=0&&n<SLIDES.length){cur.i=n;render(false)}}});

/* 시작 */
(function(){var m=/^#s(\d+)$/.exec(location.hash);if(m){var n=+m[1]-1;if(n>=0&&n<SLIDES.length)cur.i=n}})();
render(false);shareChrome();
if(!PREF.code)PREF.code="우리반";   /* 처음에는 기본 반 코드로 자동 연결. 공유할 수 없으면 이 기기에만 저장 */
connect(PREF.code);
})();
</script>
